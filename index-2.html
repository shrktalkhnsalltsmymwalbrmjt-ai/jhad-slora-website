<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EEDF">
<title>حلويات جهاد سلورة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6EEDF;--card:#FFFAF1;--ink:#3B2A1E;--c:#5A3A27;--g:#B58A34;--line:#E3D3B4;color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 Tajawal,sans-serif;padding-bottom:90px;background-image:radial-gradient(rgba(181,138,52,.09) 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3{font-family:'Aref Ruqaa',Georgia,serif;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero{text-align:center;padding:30px 18px 10px;position:relative}
.hero img{width:210px;max-width:62%;height:auto}
.hero p{color:var(--g);font-family:'Aref Ruqaa',Georgia,serif;font-size:20px;margin-top:4px}
.lg{position:absolute;top:14px;inset-inline-start:14px;font:700 14px Tajawal,sans-serif;border:1px solid var(--g);background:none;color:var(--c);border-radius:18px;padding:3px 14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.chips a,.chips span{font-size:14px;padding:4px 14px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);text-decoration:none}
.chips a{border-color:var(--g);color:var(--c);font-weight:500}
#offers{max-width:680px;margin:14px auto 0;padding:0 18px}
h2{font-size:28px;display:flex;align-items:center;gap:12px;margin-bottom:6px}
h2:after{content:"";flex:1;border-top:1px solid var(--g)}
.ofs{display:flex;gap:12px;overflow-x:auto;padding:6px 0 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.of{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:var(--c);color:#F6EEDF;border-radius:16px;overflow:hidden;border:1px solid var(--g)}
.of img{width:100%;height:130px;object-fit:cover;display:block;cursor:zoom-in}
.of div{padding:12px 14px}
.of h3{font-size:22px;color:#E7C673;line-height:1.4}
.of p{font-size:14px;opacity:.9}
.of b{display:inline-block;margin-top:6px;color:#E7C673}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));scrollbar-width:none;margin-top:10px}
.nav a{white-space:nowrap;padding:4px 16px;border-radius:18px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a.on{background:var(--c);color:#F6EEDF}
main{max-width:680px;margin:0 auto;padding:4px 18px;min-height:200px}
section.cat{padding-top:20px}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dotted var(--g)}
.it img{width:64px;height:64px;border-radius:12px;object-fit:cover;cursor:zoom-in;flex:none;background:var(--line)}
.it .n{flex:1;font-weight:700;font-size:17px;line-height:1.4}
.pr{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:58%}
.pr button{font:inherit;font-size:14px;background:var(--card);color:var(--c);border:1px solid var(--c);border-radius:18px;padding:3px 12px;cursor:pointer}
.pr button:active{background:var(--c);color:#F6EEDF}
.na{font-size:13px;color:var(--g)}
.state{padding:50px 10px;text-align:center;color:var(--g)}
.state button{margin-top:10px}
.bar{position:fixed;inset:auto 0 0 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--c);color:#F6EEDF;display:none;justify-content:space-between;align-items:center;z-index:9}
.bar button,.btn{font:inherit;font-weight:700;border:0;border-radius:24px;padding:9px 22px;cursor:pointer;background:#E7C673;color:var(--c)}
.sheet{position:fixed;inset:0;background:rgba(40,25,15,.55);display:none;z-index:20;align-items:flex-end}
.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:680px;margin:0 auto;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dotted var(--g)}
.q{display:flex;align-items:center;gap:8px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--c);background:none;color:var(--c);font-size:18px;line-height:1;cursor:pointer}
input,textarea{font:inherit;width:100%;padding:9px 12px;margin:5px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.seg{display:flex;gap:8px;margin:12px 0 6px;flex-wrap:wrap}
.seg label{flex:1;min-width:90px;text-align:center;border:1px solid var(--c);border-radius:20px;padding:5px;cursor:pointer;font-size:14px}
.seg input{display:none}
.seg label:has(input:checked){background:var(--c);color:#F6EEDF;font-weight:700}
.full{display:block;width:100%;text-align:center;margin-top:10px;background:var(--c);color:#F6EEDF;text-decoration:none}
.full.o{background:none;color:var(--c);border:1px solid var(--c)}
.full.wa{background:#1f8f4e;color:#fff}
.err{color:#a3261b;font-size:14px;min-height:20px}
.lb{position:fixed;inset:0;background:rgba(20,10,5,.88);display:none;z-index:30;align-items:center;justify-content:center}
.lb.show{display:flex}.lb img{max-width:94%;max-height:88%;border-radius:12px}
footer{margin-top:36px;text-align:center;border-top:1px solid var(--g);padding:26px 18px 0}
.soc{display:flex;gap:12px;justify-content:center;margin:14px 0}
.soc a{width:42px;height:42px;border-radius:50%;background:var(--c);color:#E7C673;display:grid;place-items:center}
.soc svg{width:20px;height:20px;fill:currentColor}
.fb{max-width:340px;margin:0 auto}
.cred{margin:26px -18px 0;background:#2b1a10;color:#e9d9b4;padding:14px;font-size:13px;line-height:1.8}
.cred a{color:#E7C673;text-decoration:none}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.sheet>div{animation:up .25s ease}@keyframes up{from{transform:translateY(30px);opacity:0}}}
</style>
</head>
<body>
<header class="hero">
  <button class="lg" id="lg" hidden>EN</button>
  <img id="logo" alt="" width="210" height="248">
  <h1 class="sr" id="h1"></h1>
  <p id="tag"></p>
  <div class="chips" id="chips"></div>
</header>
<section id="offers" hidden><h2 id="otl"></h2><div class="ofs" id="ofs"></div></section>
<nav class="nav" id="nav"></nav>
<main id="menu"><div class="state">...</div></main>
<footer>
  <h3 id="fname"></h3>
  <div class="soc" id="soc"></div>
  <div class="fb" id="fb"></div>
  <div class="cred" id="cred"></div>
</footer>
<div class="bar" id="bar"><span id="bt"></span><button id="open"></button></div>
<div class="sheet" id="sh"><div id="sb"></div></div>
<div class="lb" id="lb"><img alt=""></div>

  if (S.mobile) b.push(tel(t('mob'), S.mobile));
  $('fb').innerHTML = b.join('');
  $('cred').innerHTML = esc(t('credit')) + ' <b>' + esc(lang === 'ar' ? CO.name : CO.nameEn) + '</b><br>' + esc(t('contact')) + ': <a href="https://wa.me/' + CO.tel + '" dir="ltr">+963 934 664 381</a>';
}

/* ---------- السلة ---------- */
const find = id => (D.menu || []).find(x => x.id === id);
const lines = () => cart.map(c => ({ c: c, it: find(c.id) })).filter(l => l.it && price(l.it, l.c.size) != null);
const sub = () => lines().reduce((a, l) => a + price(l.it, l.c.size) * l.c.qty, 0);
const cnt = () => lines().reduce((a, l) => a + l.c.qty, 0);
function bar() {
  const n = cnt();
  $('bar').style.display = n ? 'flex' : 'none';
  $('bt').textContent = n + ' ' + t('items') + ' · ' + fmt(sub()) + ' ' + cur();
}
document.addEventListener('click', e => {
  const b = e.target.closest('.pr button');
  if (b) {
    const f = cart.find(c => c.id === b.dataset.id && c.size === b.dataset.s);
    if (f) f.qty = Math.min(99, f.qty + 1); else cart.push({ id: b.dataset.id, size: b.dataset.s, qty: 1 });
    bar(); return;
  }
  const im = e.target.closest('img[data-big]');
  if (im) { $('lb').querySelector('img').src = im.dataset.big; $('lb').classList.add('show'); }
});
$('lb').onclick = () => $('lb').classList.remove('show');
$('lg').onclick = () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('jsl_lang', lang); } catch (e) {}
  D = null; $('menu').innerHTML = '<div class="state">...</div>'; start();
};
$('open').onclick = () => { drawCart(); $('sh').classList.add('show'); };
$('sh').addEventListener('click', e => { if (e.target === $('sh')) $('sh').classList.remove('show'); });

function drawCart() {
  const ls = lines();
  const modes = [];
  if (S.delivery) modes.push(['delivery', t('delivery')]);
  if (S.pickup) modes.push(['pickup', t('pickup')]);
  if (S.dinein) modes.push(['dine', t('dine')]);
  if (!modes.some(m => m[0] === mode)) mode = modes.length ? modes[0][0] : '';
  const fee = mode === 'delivery' ? Number(S.fee) || 0 : 0;
  let h = '<h3>' + esc(t('cart')) + '</h3>';
  if (!ls.length) { $('sb').innerHTML = h + '<div class="state">' + esc(t('empty')) + '</div>'; return; }
  h += ls.map((l, i) => '<div class="row"><span>' + esc(l.it.name) + (l.it.unit === 'kg' ? ' (' + esc(t(l.c.size === 'full' ? 'kg' : l.c.size)) + ')' : '') + '</span><span class="q"><button data-m="' + i + '" aria-label="-">−</button>' + l.c.qty + '<button data-p="' + i + '" aria-label="+">+</button><b>' + fmt(price(l.it, l.c.size) * l.c.qty) + '</b></span></div>').join('');
  if (!modes.length) { h += '<p class="err">' + esc(t('closed')) + '</p>'; }
  else {
    h += '<div class="seg">' + modes.map(m => '<label><input type="radio" name="m" value="' + m[0] + '"' + (m[0] === mode ? ' checked' : '') + '><span>' + esc(m[1]) + '</span></label>').join('') + '</div>' +
      '<input id="cn" autocomplete="name" placeholder="' + esc(t('name')) + '"><input id="cp" type="tel" autocomplete="tel" inputmode="tel" placeholder="' + esc(t('phone')) + '">' +
      (mode === 'delivery' ? '<input id="ca" autocomplete="street-address" placeholder="' + esc(t('addr')) + '">' : '') +
      '<textarea id="cx" rows="2" placeholder="' + esc(t('notes')) + '"></textarea>';
  }
  if (fee) h += '<div class="row"><span>' + esc(t('fee')) + '</span><b>' + fmt(fee) + '</b></div>';
  h += '<div class="row"><b>' + esc(t('total')) + '</b><b>' + fmt(sub() + fee) + ' ' + esc(cur()) + '</b></div><p class="err" id="er"></p>' +
    (modes.length ? '<button class="btn full" id="go">' + esc(t('send')) + '</button>' : '') + '<button class="btn full o" id="cl">' + esc(t('more')) + '</button>';
  const keep = { n: ($('cn') || {}).value, p: ($('cp') || {}).value, a: ($('ca') || {}).value, x: ($('cx') || {}).value };
  $('sb').innerHTML = h;
  if ($('cn') && keep.n) $('cn').value = keep.n; if ($('cp') && keep.p) $('cp').value = keep.p;
  if ($('ca') && keep.a) $('ca').value = keep.a; if ($('cx') && keep.x) $('cx').value = keep.x;
  $('sb').querySelectorAll('[data-m]').forEach(b => b.onclick = () => chg(ls[b.dataset.m].c, -1));
  $('sb').querySelectorAll('[data-p]').forEach(b => b.onclick = () => chg(ls[b.dataset.p].c, 1));
  $('sb').querySelectorAll('[name=m]').forEach(r => r.onchange = () => { mode = r.value; drawCart(); });
  $('cl').onclick = () => $('sh').classList.remove('show');
  if ($('go')) $('go').onclick = submit;
}
function chg(c, d) {
  c.qty += d;
  if (c.qty < 1) cart.splice(cart.indexOf(c), 1);
  if (c.qty > 99) c.qty = 99;
  bar(); drawCart();
  if (!cart.length) $('sh').classList.remove('show');
}
function submit() {
  if (busy) return;
  const n = $('cn').value.trim(), p = $('cp').value.trim(), a = $('ca') ? $('ca').value.trim() : '';
  if (!n || dg(p).length < 6 || (mode === 'delivery' && !a)) { $('er').textContent = t('need') + (mode === 'delivery' ? ' ' + t('needA') : ''); return; }
  busy = true; $('go').textContent = t('sending'); $('er').textContent = '';
  const body = { action: 'order', name: n, phone: p, mode: mode, address: a, notes: $('cx').value.trim(), items: lines().map(l => ({ id: l.c.id, size: l.c.size, qty: l.c.qty })) };
  fetch(API, { method: 'POST', body: JSON.stringify(body) }).then(r => r.json()).then(r => {
    busy = false;
    if (!r.ok) throw new Error(r.error || 'error');
    cart = []; bar(); done(r, body);
  }).catch(e => { busy = false; if ($('go')) $('go').textContent = t('send'); if ($('er')) $('er').textContent = e.message === 'Failed to fetch' ? t('err') : e.message; });
}
function done(r, b) {
  let txt = '*' + t('neworder') + ' #' + r.id + '*\n' + r.lines.map(l => '• ' + l.name + (l.label ? ' (' + l.label + ')' : '') + ' × ' + l.qty + ' = ' + fmt(l.price)).join('\n');
  if (r.fee) txt += '\n' + t('fee') + ': ' + fmt(r.fee);
  txt += '\n' + t('total') + ': ' + fmt(r.total) + ' ' + cur() + '\n' + t(b.mode === 'dine' ? 'dine' : b.mode) + '\n' + b.name + ' - ' + b.phone;
  if (b.address) txt += '\n' + b.address;
  if (b.notes) txt += '\n' + b.notes;
  const w = dg(S.wa);
  $('sb').innerHTML = '<h3>' + esc(t('done')) + '</h3><div class="row"><span>' + esc(t('no')) + '</span><b>#' + r.id + '</b></div><div class="row"><span>' + esc(t('total')) + '</span><b>' + fmt(r.total) + ' ' + esc(cur()) + '</b></div>' +
    (w ? '<a class="btn full wa" target="_blank" rel="noopener" href="https://wa.me/' + w + '?text=' + encodeURIComponent(txt) + '">' + esc(t('sendWa')) + '</a>' : '') + '<button class="btn full o" id="cl">' + esc(t('more')) + '</button>';
  $('cl').onclick = () => $('sh').classList.remove('show');
}

$('logo').src = LOGO;
start();
</script>
</body>
</html>
